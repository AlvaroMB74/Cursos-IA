      if (!item) return null;

        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;

        return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}?autoplay=1&mute=1&rel=0` : null;
      };
      const youtubeLink = item.videoUrl ? getYoutubeEmbed(item.videoUrl) : null;
      useEffect(() => {
        const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', handleEsc);
        return () => window.removeEventListener('keydown', handleEsc);
      }, [onClose]);

        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-sm animate-fade-in" onClick={onClose}>

          'LITERATURA': 'CULTURA',

          'HITO CIENTÍFICO': 'DESARROLLO IA',
          'HITO TECNOLÓGICO': 'DESARROLLO IA',
          'NACIMIENTO IA': 'DESARROLLO IA',
          'HITO CRUCIAL': 'DESARROLLO IA',
          'ACTUALIDAD': 'DESARROLLO IA',

          'FUTURO HIPOTÉTICO': 'FUTURO',
          'FUTURO LEJANO': 'FUTURO'
        };

        const superCatKey = map[type] || 'CULTURA';
        return CATEGORY_MAP[superCatKey];
      };

      // DATOS ORIGINALES DEL ARCHIVO, TRADUCIDOS
      const rawData = [
        { year: "c. 300 a.C.", type: "FILOSOFÍA / CIENCIA", importance: "mediano", title: "Siloxismos de Aristóteles", text: "Formulación de leis lóxicas que gobernan o razoamento.", imageUrl: "./Img/Aristoteles.jpg", videoUrl: "", linkUrl: "" },

        { year: "1642", type: "HITO TECNOLÓGICO", importance: "pequeño", title: "A Pascalina", text: "Pascal suxire que a máquina 'pensa' máis ca un animal.", imageUrl: "./Img/pascalina.jpg", videoUrl: "", linkUrl: "" },

        { year: "1943", type: "HITO CIENTÍFICO", importance: "mediano", title: "Modelo Neurona Artificial", text: "McCulloch e Pitts crean o primeiro modelo matemático dunha neurona biolóxica.", imageUrl: "./Img/perceptron.jpg", videoUrl: "", linkUrl: "" },
        { year: "1950", type: "LITERATURA", importance: "pequeño", title: "I Robot. Isaac Asimov", text: "Leis da robótica, psicoloxía dunha mente artificial.", imageUrl: "./Img/Irobot.jpg", videoUrl: "", linkUrl: "" },

        { year: "2020", type: "HITO CIENTÍFICO", importance: "mediano", title: "Modelos de Difusión", text: "Base para crear imaxes de alta calidade.", imageUrl: "./Img/Difusion.jpg", videoUrl: "", linkUrl: "" },
        { year: "2022", type: "HITO TECNOLÓGICO", importance: "grande", title: "ChatGPT", text: "Adopción masiva da IA conversacional.", imageUrl: "./Img/ChatGPT.jpg", videoUrl: "", linkUrl: "" },
        { year: "2023", type: "HITO CIENTÍFICO", importance: "mediano", title: "RAG", text: "Xeración aumentada por recuperación.", imageUrl: "./Img/RAG.jpg", videoUrl: "", linkUrl: "" },
        { year: "2023", type: "HITO TECNOLÓGICO", importance: "grande", title: "GPT-4 (Multimodal)", text: "Razoamento avanzado multimodal.", imageUrl: "./Img/Multimodal.jpg", videoUrl: "", linkUrl: "" },

        { year: "2026", type: "FUTURO PRÓXIMO", importance: "mediano", title: "“Embodied AI”", text: "Robots aprenden física intuitiva.", imageUrl: "./Img/Embodied.jpg", videoUrl: "", linkUrl: "" },
        { year: "2027", type: "FUTURO PRÓXIMO", importance: "mediano", title: "Memoria Infinita", text: "Autoactualización en tempo real.", imageUrl: "./Img/Autoactualizable.jpg", videoUrl: "", linkUrl: "" },
        { year: "2028", type: "FUTURO PRÓXIMO", importance: "pequeño", title: "Cine Xenerativo", text: "Películas 100% IA personalizadas.", imageUrl: "./Img/cine.jpg", videoUrl: "", linkUrl: "" },
        { year: "2029", type: "FUTURO HIPOTÉTICO", importance: "grande", title: "A Primeira AGI", text: "IA supera capacidade humana en tarefas económicas.", imageUrl: "./Img/AGI.jpg", videoUrl: "", linkUrl: "" },

        { year: "2035", type: "FUTURO LEJANO", importance: "grande", title: "A Singularidade (ASI)", text: "Superintelixencia Artificial.", imageUrl: "./Img/ASI.jpg", videoUrl: "", linkUrl: "" },

      const FILTER_GROUPS = [
        { id: 'all', label: 'Todo' },
        { id: 'cultura', label: 'Cultura', types: ['CULTURA'] },
        { id: 'ia', label: 'Desenv. IA', types: ['DESARROLLO IA'] },
        { id: 'futuro', label: 'Futuro', types: ['FUTURO'] },
      ];

      const RECOMMENDED_LINKS = [
        { id: 1, title: "Canal Dot CSV", description: "Divulgación sobre Machine Learning e Intelixencia Artificial en castelán, enfoque técnico pero visual.", url: "https://www.youtube.com/@DotCSV", icon: "youtube" },

      ];

      const [activeFilter, setActiveFilter] = useState('all');
      const [searchTerm, setSearchTerm] = useState('');
      const [expandedId, setExpandedId] = useState(null);
      const [failedImages, setFailedImages] = useState({});

      const filteredData = useMemo(() => {
        return rawData.filter(item => {
          const matchesSearch =
            item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.text.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.year.includes(searchTerm);

          let matchesFilter = true;
          if (activeFilter !== 'all') {
            const itemSuperCat = resolveCategory(item.type);
            const mapReverse = {
              'CULTURA': 'cultura',
              'DESARROLLO IA': 'ia',
              'FUTURO HIPOTÉTICO': 'futuro'
            };
            const superLabel = itemSuperCat.label;

          return matchesSearch && matchesFilter;

              <div className="flex gap-2">

                    key={group.id}
                    onClick={() => setActiveFilter(group.id)}
                    className={`px-4 py-1 rounded-sm text-xs font-bold uppercase tracking-wider transition-all duration-300 flex items-center gap-1.5 border ${activeFilter === group.id
                      ? 'bg-cream text-dark border-cream shadow-[0_0_10px_rgba(255,255,255,0.3)]'
                      : 'bg-white/5 text-dim border-transparent hover:border-white/20 hover:text-white'
                      }`}
                  >
                    {group.id === 'all' && <Filter size={10} />}
                    {group.label}
                  </button>
                ))}
              </div>
            </div>

            {/* GUÍA DE CORES SIMPLIFICADA */}
            <div className="max-w-5xl mx-auto mt-2 flex justify-center gap-6 text-[10px] uppercase tracking-widest text-dim opacity-70">
              <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-gold shadow-[0_0_5px_var(--accent-gold)]"></div> Cultura</div>
              <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-cyan shadow-[0_0_5px_#06B6D4]"></div> Desenv. IA</div>
              <div className="flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-purple shadow-[0_0_5px_#8B5CF6]"></div> Futuro</div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 py-12">
            <div className="relative">
              <div className="hidden md:block absolute left-1/2 transform -translate-x-1/2 w-px bg-white/10 h-full"></div>

              <div className="space-y-12">
                {filteredData.length === 0 ? (
                  <div className="text-center py-20 text-dim"><p className="text-xl">Non se atoparon fitos.</p></div>
                ) : (
                  filteredData.map((item, index) => {
                    // RESOLUCIÓN DE ESTILO SEGÚN SUPER-CATEGORÍA
                    const superCat = resolveCategory(item.type);
                    const Icon = superCat.icon;
                    const shadowColor = superCat.colorHex;

                    // RESOLUCIÓN DE TAMAÑO
                    const sizeSettings = SIZE_CONFIG[item.importance] || SIZE_CONFIG['mediano'];
                    const isLeft = index % 2 === 0;

                    const originalHasImage = item.imageUrl && item.imageUrl.trim() !== "";
                    const isImageBroken = failedImages[index];
                    const hasImage = originalHasImage && !isImageBroken;
                    const hasVideo = item.videoUrl && item.videoUrl.trim() !== "";

                    const xOffset = isLeft ? '-15px' : '15px';
                    const shadowStyle = {
                      boxShadow: `${xOffset} 15px 30px -5px ${shadowColor}25`,
                      borderColor: `${shadowColor}40`
                    };

                    return (
                      <div key={index} className={`relative flex flex-col md:flex-row items-center ${isLeft ? 'md:flex-row-reverse' : ''}`}>

                        <div className="hidden md:block w-1/2" />

                        {/* PUNTO CENTRAL */}
                        <div
                          className="absolute left-4 md:left-1/2 transform -translate-x-1/2 w-5 h-5 rounded-full border-4 border-dark z-20 mt-1 md:mt-0 transition-all duration-300"
                          style={{
                            backgroundColor: shadowColor,
                            boxShadow: `0 0 15px 2px ${shadowColor}`
                          }}
                        ></div>

                        <div className={`w-full md:w-1/2 pl-12 md:pl-0 ${isLeft ? 'md:pr-12 text-left' : 'md:pl-12 text-left'}`}>

                          <div
                            className={`
                                  group relative rounded-sm transition-all duration-500 cursor-pointer overflow-hidden
                                  ${hasImage ? 'bg-black text-white' : 'bg-card'}
                                  ${sizeSettings.scale} 
                                  ${sizeSettings.border}
                                  hover:z-30 hover:scale-[1.03]
                                `}
                            style={{
                              ...shadowStyle,
                              borderLeftColor: isLeft ? shadowColor : 'transparent',
                              borderColor: shadowColor
                            }}
                            onClick={() => setExpandedId(expandedId === index ? null : index)}
                          >
                            {originalHasImage && (
                              <React.Fragment>
                                {/* CAPA DE IMAGEN (VISUAL Z-0) */}
                                <div
                                  className={`absolute inset-0 z-0 ${isImageBroken ? 'hidden' : 'block'}`}
                                >
                                  <img
                                    src={item.imageUrl}
                                    alt={item.title}
                                    className="w-full h-full object-cover opacity-40 grayscale group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-700"
                                    onError={() => handleImageError(index)}
                                  />
                                </div>
                                <div className={`absolute inset-0 z-0 bg-gradient-to-t from-dark via-dark/90 to-transparent pointer-events-none ${isImageBroken ? 'hidden' : 'block'}`}></div>

                                {/* CAPA DE ICONO MEDIA (INTERACTIVA Z-20) */}
                                {/* El contenedor es pointer-events-none para dejar pasar clicks al texto/padding (expandir) */}
                                <div className="absolute inset-0 z-20 pointer-events-none flex items-center justify-center">
                                  {/* El botón en sí captura clicks */}
                                  <div
                                    className="opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-auto cursor-pointer hover:scale-110 transition-transform"
                                    onClick={(e) => openMedia(e, item)}
                                  >
                                    {hasVideo ? (
                                      <div className="bg-red-600/90 text-white p-3 rounded-full shadow-lg"><PlayCircle size={32} /></div>
                                    ) : (
                                      <div className="bg-black/70 text-gold p-2 rounded-full border border-gold/50"><Maximize size={24} /></div>
                                    )}
                                  </div>
                                </div>
                              </React.Fragment>
                            )}

                            <div className={`relative z-10 ${sizeSettings.padding}`}>
                              <div className="flex items-center justify-between mb-2">
                                <div className="flex flex-col items-start">
                                  <span
                                    className="text-[10px] font-bold uppercase tracking-widest mb-1"
                                    style={{ color: shadowColor }}
                                  >
                                    {superCat.label}
                                  </span>
                                  <span className={`text-xs font-bold tracking-widest bg-white/10 px-2 py-0.5 rounded-sm text-white`}>
                                    {item.year}
                                  </span>
                                </div>
                                {item.linkUrl ? (
                                  <a
                                    href={item.linkUrl}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    onClick={(e) => e.stopPropagation()}
                                    className="hover:scale-125 transition-transform duration-300"
                                    title="Ir a ligazón externa"
                                  >
                                    <Icon size={sizeSettings.iconSize} style={{ color: shadowColor }} />
                                  </a>
                                ) : (
                                  <Icon size={sizeSettings.iconSize} style={{ color: shadowColor }} />
                                )}
                              </div>

                              <h3 className={`font-bold leading-tight mb-2 ${sizeSettings.titleSize} ${hasImage ? 'text-white text-shadow' : 'text-cream'}`}>
                                {item.title}
                              </h3>

                              <p className="text-[10px] text-dim opacity-70 mb-2 uppercase tracking-wide">{item.type}</p>

                              <div className={`transition-all duration-500 overflow-hidden ${expandedId === index ? 'max-h-96 opacity-100' : 'max-h-24 opacity-90'}`}>
                                <p className={`${sizeSettings.textSize} leading-relaxed ${hasImage ? 'text-gray-200' : 'text-dim'}`}>
                                  {item.text}
                                </p>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>

            {/* SECCIÓN ENLACES RECOMENDADOS */}
            <div className="max-w-5xl mx-auto mt-24 pt-10 border-t border-white/10">
              <h2 className="text-xl md:text-2xl font-bold text-center text-gold uppercase tracking-widest mb-10 flex items-center justify-center gap-3">
                <PlayCircle size={24} /> Canles Recomendadas
              </h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {RECOMMENDED_LINKS.map(link => (
                  <a
                    key={link.id}
                    href={link.url}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="bg-card border border-white/5 p-6 rounded-sm hover:border-gold/30 hover:bg-white/5 transition-all group flex items-center gap-5 relative overflow-hidden"
                  >
                    <div className="absolute top-0 right-0 w-20 h-20 bg-gold/5 rounded-full -mr-10 -mt-10 group-hover:scale-150 transition-transform duration-700"></div>

                    <div className="bg-red-600/20 text-red-500 p-4 rounded-full group-hover:scale-110 group-hover:bg-red-600 group-hover:text-white transition-all duration-300 shadow-[0_0_15px_rgba(220,38,38,0.2)]">
                      <PlayCircle size={32} />
                    </div>
                    <div className="relative z-10">
                      <h3 className="text-lg font-bold text-cream group-hover:text-gold transition-colors">{link.title}</h3>
                      <p className="text-xs text-dim mt-1 group-hover:text-white/80 transition-colors">{link.description}</p>
                    </div>
                    <div className="ml-auto opacity-0 group-hover:opacity-100 transition-opacity -translate-x-2 group-hover:translate-x-0 transform duration-300">
                      <IconBase size={20} className="text-gold"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></IconBase>
                    </div>
                  </a>
                ))}
              </div>
            </div>
          </main>

          <MediaModal item={selectedMediaItem} onClose={() => setSelectedMediaItem(null)} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TimelineApp />);
  </script>
</body>

</html>
