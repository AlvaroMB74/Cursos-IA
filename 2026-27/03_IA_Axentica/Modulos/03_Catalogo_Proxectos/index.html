                                            <h5 className="text-xs uppercase font-bold tracking-wider text-cyan-400 mb-1 flex items-center gap-1">
                                                <span>📁</span> Fontes de Entrada Requiridas:
                                            </h5>
                                            <p className="text-xs text-slate-300 leading-relaxed">
                                                {selectedProject.fontes}

        root.render(<Modulo3App />);
