                                            </div>
                                            <div className="p-3 bg-emerald-950/30 border border-emerald-500/30 rounded-xl">
                                                <span className="text-emerald-400 font-bold uppercase tracking-wider block mb-1">Como actuar correctamente:</span>
                                                <p className="text-emerald-100 leading-relaxed">{current.recommendation}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="mt-6 pt-4 border-t border-slate-800 flex justify-between items-center text-xs text-slate-500">
                                        <span>Caso {activeCase + 1} de {cases.length}</span>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={() => setActiveCase(prev => prev > 0 ? prev - 1 : cases.length - 1)}
                                                className="px-3 py-1 rounded bg-slate-800 text-white hover:bg-slate-700"
                                            >
                                                Anterior
                                            </button>
                                            <button
                                                onClick={() => setActiveCase(prev => prev < cases.length - 1 ? prev + 1 : 0)}
                                                className="px-3 py-1 rounded bg-purple-600 text-white font-bold hover:bg-purple-500"
                                            >
                                                Seguinte
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PESTANA 4: TEXTOS NORMATIVOS */}
                        {activeTab === 'normativa' && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="grid md:grid-cols-2 gap-5">
                                    {documentos.map(doc => (
                                        <div
                                            key={doc.id}
                                            onClick={() => setSelectedDoc(doc)}
                                            className={`bg-slate-900 border rounded-2xl p-5 cursor-pointer transition-all hover:-translate-y-1 ${
                                                selectedDoc?.id === doc.id
                                                    ? 'border-purple-500 bg-slate-850 shadow-lg shadow-purple-500/10'
                                                    : 'border-slate-800 hover:border-slate-700'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase bg-purple-500/20 text-purple-300 border border-purple-500/30">
                                                    {doc.ano}
                                                </span>
                                                <span className="text-xs text-slate-500 font-mono">Oficial</span>
                                            </div>
                                            <h4 className="text-base font-bold text-white mb-1">{doc.titulo}</h4>
                                            <p className="text-xs text-slate-400 mb-3">{doc.subtitulo}</p>
                                            <p className="text-xs text-slate-300 leading-relaxed mb-4 line-clamp-2">
                                                {doc.resumo}
                                            </p>
                                            <div className="text-[11px] font-bold text-purple-400 flex items-center gap-1">
                                                <span>Ver puntos clave</span> &rarr;
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {selectedDoc && (
                                    <div className="bg-slate-900 border-2 border-purple-500/50 rounded-2xl p-6 relative animate-fadeIn shadow-2xl">
                                        <button
                                            onClick={() => setSelectedDoc(null)}
                                            className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center"
                                        >
                                            ✕
                                        </button>
                                        <span className="text-xs font-mono uppercase text-purple-400 font-bold">Documento Oficial</span>
                                        <h3 className="text-2xl font-bold text-white mt-1 mb-2">{selectedDoc.titulo}</h3>
                                        <p className="text-slate-300 text-sm leading-relaxed mb-4">{selectedDoc.resumo}</p>
                                        <div className="border-t border-slate-800 pt-4">
                                            <h5 className="text-xs uppercase font-bold tracking-wider text-slate-400 mb-3">Puntos Clave para Docentes:</h5>
                                            <ul className="space-y-2 text-xs text-slate-300">
                                                {selectedDoc.claves.map((c, i) => (
                                                    <li key={i} className="flex items-start gap-2">
                                                        <span className="text-purple-400 font-bold">•</span>
                                                        <span>{c}</span>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Modulo5App />);
    </script>
</body>

</html>
