<!DOCTYPE html>
<html lang="gl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 4: Obradoiro de Deseño: A Ficha do Colaborador (Edición 2026–2027)</title>
    <link rel="stylesheet" href="../../CSS/estilos_ia.css">
    <link rel="stylesheet" href="../../CSS/axentica.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        'card-elevated': '#334155',
                        cream: '#f8fafc',
                        dim: '#94a3b8',
                        orange: '#f97316',
                        gold: '#f59e0b',
                        cyan: '#06b6d4',
                        emerald: '#10b981',
                        purple: '#8b5cf6',
                        rose: '#f43f5e'
                    },
                    fontFamily: {
                        sans: ['Open Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow-y: auto;
        }
    </style>
</head>

<body class="custom-scroll selection:bg-amber-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Modulo4App = () => {
            const [formData, setFormData] = useState({
                nomeProxecto: "Visualizador do Orzamento Municipal",
                tipoUso: "persoal",
                finalidade: "Crear un panel web interactivo para analizar as partidas de gasto social do meu concello nos últimos dous anos e comparalas con claridade.",
                entregable: "Un arquivo autónomo 'index.html' con gráficas en Chart.js e táboas filtrables.",
                fontes: "CSV descargado do portal de Transparencia Municipal (ano 2024 e 2025) con metadatos de orixe.",
                permisos: "Lectura de CSVs locais, cálculo estatístico determinista e xeración de código HTML/JS limpo.",
                prohibicions: "Prohibido saír a internet a buscar datos adicionais, prohibido modificar o CSV orixinal e prohibido usar terminal libre.",
                etapasPlan: "1. Inspección e informe de cabeceiras.\n2. Limpeza e agregación de datos por áreas.\n3. Deseño do HTML con gráficas.\n4. Auditoría e comprobación de sumas totais.",
                criterioVerificacion: "Comprobar que a suma total das gráficas coincida exactamente co total orzamentario oficial do concello.",
                riscoIdentificado: "O modelo pode interpretar mal os separadores decimais (comas fronte a puntos) ou confundir euros con miles de euros."
            });

            const [copied, setCopied] = useState(false);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const markdownOutput = `# FICHA DE DESEÑO DO COLABORADOR DIXITAL
**Proxecto:** ${formData.nomeProxecto}
**Ámbito:** ${formData.tipoUso === 'persoal' ? 'Uso Cidadán e Persoal' : 'Práctica Docente'}
**Data de deseño:** 2026-11-13

---

### 1. Finalidade e Entregable Esperado
- **Obxectivo:** ${formData.finalidade}
- **Produto final:** ${formData.entregable}

---

### 2. Espazo de Traballo e Fontes Autorizadas
- **Arquivos no Workspace:**
  ${formData.fontes}
- **Regra de illamento:** O colaborador traballará exclusivamente cos datos da carpeta local do proxecto.

---

### 3. Permisos e Liñas Vermellas
- **Accións autorizadas:** ${formData.permisos}
- **Accións prohibidas:** ${formData.prohibicions}
- **Human-in-the-loop:** Requírese aprobación previa antes de calquera sobrescritura ou creación de ficheiros executables.

---

### 4. Plan Previo Obrigatorio
O colaborador deberá presentar e agardar confirmación sobre as seguintes fases antes de iniciar a execución:
\`\`\`text
${formData.etapasPlan}
\`\`\`

---

### 5. Protocolo de Verificación e Control de Calidade
- **Punto de comprobación obxectiva:** ${formData.criterioVerificacion}

---

### 6. Rexistro de Riscos e Incidencias
- **Risco potencial identificado:** ${formData.riscoIdentificado}
`;

            const handleCopy = () => {
                navigator.clipboard.writeText(markdownOutput);
                setCopied(true);
                setTimeout(() => setCopied(false), 2500);
            };

            const handleDownload = () => {
                const blob = new Blob([markdownOutput], { type: "text/markdown;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `FICHA_${formData.nomeProxecto.replace(/\s+/g, "_")}.md`;
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 p-6 md:p-10 pl-20 md:pl-24">
                    {/* Cabeceira */}
                    <div className="max-w-6xl mx-auto mb-8 border-b border-slate-800 pb-6">
                        <div className="flex flex-wrap items-center justify-between gap-4 mb-3">
                            <div className="flex items-center gap-3">
                                <span className="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-amber-500/20 text-amber-400 border border-amber-500/30">
                                    Módulo 4
                                </span>
                                <span className="text-slate-400 text-sm">Obradoiro Práctico de Creación</span>
                            </div>
                            <div className="text-xs text-slate-500 font-mono">
                                Entregable: FICHA_DESEÑO_COLABORADOR.md
                            </div>
                        </div>
                        <h1 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
                            Obradoiro: A Ficha do Colaborador Dixital
                        </h1>
                        <p className="text-slate-400 text-base md:text-lg mt-2 max-w-4xl">
                            A metodoloxía do <strong className="text-amber-400">proxecto único</strong>: deseña aquí a ficha mestra que pegarás no teu axente para fixar obxectivos, delimitar fontes, esixir o plan previo e acoutar os permisos.
                        </p>
                    </div>

                    <div className="max-w-6xl mx-auto grid lg:grid-cols-12 gap-8">
                        {/* Formulario Interactivo (7 columnas) */}
                        <div className="lg:col-span-7 space-y-6">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                    <span className="text-amber-400">✍️</span> 1. Identidade e Propósito
                                </h3>

                                <div className="grid md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-slate-400 mb-1">Nome do Proxecto</label>
                                        <input
                                            type="text"
                                            name="nomeProxecto"
                                            value={formData.nomeProxecto}
                                            onChange={handleChange}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:border-amber-500 outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-slate-400 mb-1">Ámbito de Aplicación</label>
                                        <select
                                            name="tipoUso"
                                            value={formData.tipoUso}
                                            onChange={handleChange}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:border-amber-500 outline-none"
                                        >
                                            <option value="persoal">Uso Cidadán e Persoal</option>
                                            <option value="docente">Práctica Docente / Aula</option>
                                        </select>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold uppercase text-slate-400 mb-1">Finalidade Principal</label>
                                    <textarea
                                        rows="2"
                                        name="finalidade"
                                        value={formData.finalidade}
                                        onChange={handleChange}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-white focus:border-amber-500 outline-none"
                                    />
                                </div>

                                <div>
                                    <label className="block text-xs font-bold uppercase text-slate-400 mb-1">Produto Final / Entregable</label>
                                    <input
                                        type="text"
                                        name="entregable"
                                        value={formData.entregable}
                                        onChange={handleChange}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:border-amber-500 outline-none"
                                    />
                                </div>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                    <span className="text-cyan-400">📁</span> 2. Fontes e Permisos
                                </h3>

                                <div>
                                    <label className="block text-xs font-bold uppercase text-slate-400 mb-1">Fontes Autorizadas no Workspace</label>
                                    <input
                                        type="text"
                                        name="fontes"
                                        value={formData.fontes}
                                        onChange={handleChange}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:border-cyan-500 outline-none"
                                    />
                                </div>

                                <div className="grid md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-emerald-400 mb-1">Accións Permitidas</label>
                                        <input
                                            type="text"
                                            name="permisos"
                                            value={formData.permisos}
                                            onChange={handleChange}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:border-emerald-500 outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-rose-400 mb-1">Liñas Vermellas (Prohibido)</label>
                                        <input
                                            type="text"
                                            name="prohibicions"
                                            value={formData.prohibicions}
                                            onChange={handleChange}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:border-rose-500 outline-none"
                                        />
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                    <span className="text-purple-400">🛡️</span> 3. Plan Previo e Verificación
                                </h3>

                                <div>
                                    <label className="block text-xs font-bold uppercase text-slate-400 mb-1">Fases do Plan Previo Obrigatorio</label>
                                    <textarea
                                        rows="3"
                                        name="etapasPlan"
                                        value={formData.etapasPlan}
                                        onChange={handleChange}
                                        className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-white font-mono focus:border-purple-500 outline-none"
                                    />
                                </div>

                                <div className="grid md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-cyan-400 mb-1">Punto de Verificación Obxectiva</label>
                                        <textarea
                                            rows="2"
                                            name="criterioVerificacion"
                                            value={formData.criterioVerificacion}
                                            onChange={handleChange}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-white focus:border-cyan-500 outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-amber-400 mb-1">Risco e Alucinación Prevista</label>
                                        <textarea
                                            rows="2"
                                            name="riscoIdentificado"
                                            value={formData.riscoIdentificado}
                                            onChange={handleChange}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-white focus:border-amber-500 outline-none"
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Vista Previa Markdown xerada en tempo real (5 columnas) */}
                        <div className="lg:col-span-5 space-y-4">
                            <div className="sticky top-6">
                                <div className="flex items-center justify-between mb-2">
                                    <span className="text-xs uppercase font-bold tracking-wider text-slate-400">
                                        Ficha Markdown Xerada
                                    </span>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={handleCopy}
                                            className="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold text-amber-400 transition-all border border-slate-700"
                                        >
                                            {copied ? "✓ Copiado!" : "📋 Copiar"}
                                        </button>
                                        <button
                                            onClick={handleDownload}
                                            className="px-3 py-1 rounded bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold transition-all shadow"
                                        >
                                            💾 Descargar .md
                                        </button>
                                    </div>
                                </div>

                                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-5 font-mono text-[11px] text-slate-300 overflow-y-auto max-h-[680px] custom-scroll leading-relaxed shadow-inner">
                                    <pre className="whitespace-pre-wrap">{markdownOutput}</pre>
                                </div>

                                <div className="mt-4 p-4 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-400">
                                    💡 <strong>Como usar este entregable:</strong> Garda este arquivo como <code className="text-amber-300">FICHA_DESEÑO.md</code> dentro da carpeta do teu proxecto. Pégallo ao axente na túa primeira mensaxe para que asuma os seus límites desde o minuto un.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Modulo4App />);
    </script>
</body>

</html>
