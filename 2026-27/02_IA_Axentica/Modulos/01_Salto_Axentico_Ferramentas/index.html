                                    {/* Selector de Casos de Proba */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
                                        {casosTest.map((caso, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => setTestSelectedCase(idx)}
                                                className={`p-3 rounded-xl text-left transition-all border text-xs font-semibold ${
                                                    testSelectedCase === idx
                                                        ? caso.tipo === 'axentico'
                                                            ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300 shadow-lg shadow-emerald-500/10'
                                                            : 'bg-red-500/20 border-red-500 text-red-300 shadow-lg shadow-red-500/10'
                                                        : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                                                }`}
                                            >
                                                <div className="flex items-center justify-between mb-1">
                                                    <span className={`px-1.5 py-0.5 rounded text-[10px] uppercase font-bold ${
                                                        caso.tipo === 'axentico' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400'
                                                    }`}>
                                                        {caso.tipo === 'axentico' ? 'Axéntico' : 'Cuasi-Chat'}
                                                    </span>
                                                </div>
                                                <div className="font-bold text-white truncate">{caso.titulo}</div>
                                            </button>
                                        ))}
                                    </div>

                                    {/* Detalle do Caso Seleccionado */}
                                    {(() => {
                                        const c = casosTest[testSelectedCase];
                                        return (
                                            <div className="bg-slate-950 rounded-xl p-5 border border-slate-800 space-y-4">
                                                <div>
                                                    <div className="text-xs uppercase tracking-wider text-slate-500 font-bold mb-1">O encargo analizado</div>
                                                    <div className="bg-slate-900 p-3 rounded-lg border border-slate-800 font-mono text-xs text-amber-300">
                                                        "{c.prompt}"
                                                    </div>
                                                </div>

                                                {/* As 6 Preguntas para este caso */}
                                                <div>
                                                    <div className="text-xs uppercase tracking-wider text-slate-500 font-bold mb-2">Avaliación das 6 preguntas:</div>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                        {preguntasTest.map((p, pIdx) => {
                                                            const pasa = c.respostas[pIdx];
                                                            return (
                                                                <div
                                                                    key={pIdx}
                                                                    className={`p-2.5 rounded-lg border text-xs flex items-center justify-between ${
                                                                        pasa
                                                                            ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-200'
                                                                            : 'bg-red-500/5 border-red-500/20 text-slate-400'
                                                                    }`}
                                                                >
                                                                    <span>{p}</span>
                                                                    <span className={`font-bold ml-2 text-sm ${pasa ? 'text-emerald-400' : 'text-red-400'}`}>
                                                                        {pasa ? 'SÍ' : 'NON'}
                                                                    </span>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>

                                                <div className={`p-4 rounded-xl border text-xs leading-relaxed ${
                                                    c.tipo === 'axentico'
                                                        ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300'
                                                        : 'bg-red-950/40 border-red-500/30 text-red-300'
                                                }`}>
                                                    <div className="font-bold mb-1 flex items-center gap-1.5">
                                                        <span>{c.tipo === 'axentico' ? '✅' : '⚠️'}</span>
                                                        <span>{c.veredicto}</span>
                                                    </div>
                                                    <p>{c.analise}</p>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>
                            </div>
                        )}

                        {/* LAPELA 3: SEGURIDADE DO USUARIO NO PC */}
                        {activeTab === 'seguridade' && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8">
                                    <div className="flex items-center gap-3 mb-4">
                                        <div className="w-10 h-10 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl font-bold">
                                            🛡️
                                        </div>
                                        <div>
                                            <h3 className="text-xl font-bold text-white">Seguridade Directa para o Usuario / Docente</h3>
                                            <p className="text-slate-400 text-xs">Cando un axente opera sobre o teu ordenador, ti es o administrador responsable.</p>
                                        </div>
                                    </div>

                                    <div className="grid md:grid-cols-2 gap-6 mt-6">
                                        {/* Risco 1: Permisos de Arquivos */}
                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="flex items-center gap-2 text-orange-400 font-bold text-sm mb-2">
                                                <span>📁</span> 1. Acoutamento do Sistema de Arquivos
                                            </div>
                                            <p className="text-xs text-slate-300 leading-relaxed mb-3">
                                                Nunca abras un axente apuntando á raíz do teu disco duro (<code className="text-amber-300 font-mono">C:\</code> ou <code className="text-amber-300 font-mono">/home/usuario</code>) nin á túa carpeta persoal de Documentos sen compartimentar.
                                            </p>
                                            <div className="p-3 rounded bg-slate-900 border border-slate-800 text-[11px] text-slate-400">
                                                <strong className="text-white">Protocolo seguro:</strong> Crea sempre unha subcarpeta específica para o proxecto (ex: <code className="text-emerald-400">/Proxecto_Orzamento</code>) con só os arquivos necesarios. O axente só debe ver ese espazo.
                                            </div>
                                        </div>

                                        {/* Risco 2: O Terminal Desatendido */}
                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="flex items-center gap-2 text-rose-400 font-bold text-sm mb-2">
                                                <span>⚡</span> 2. A Liña Vermella do Terminal Libre
                                            </div>
                                            <p className="text-xs text-slate-300 leading-relaxed mb-3">
                                                Moitas ferramentas avanzadas ofrecen un modo de execución automática en terminal. Na primeira edición do curso, <strong>prohíbese o terminal desatendido</strong>.
                                            </p>
                                            <div className="p-3 rounded bg-slate-900 border border-slate-800 text-[11px] text-slate-400">
                                                <strong className="text-white">Por que:</strong> Un script con alucinacións pode sobreescribir ficheiros, instalar dependencias conflitivas ou borrar datos sen posibilidade de desfacer.
                                            </div>
                                        </div>

                                        {/* Risco 3: Claves de API e Credenciais */}
                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="flex items-center gap-2 text-amber-400 font-bold text-sm mb-2">
                                                <span>🔑</span> 3. Protección de Credenciais e Tokens
                                            </div>
                                            <p className="text-xs text-slate-300 leading-relaxed mb-3">
                                                As claves de API son equivalentes ao teu contrasinal e tarxeta bancaria. Nunca pegues unha clave de API nun prompt nin subas arquivos <code className="text-amber-300 font-mono">.env</code> a servizos públicos.
                                            </p>
                                            <div className="p-3 rounded bg-slate-900 border border-slate-800 text-[11px] text-slate-400">
                                                <strong className="text-white">Solución da aula:</strong> No curso traballarase con instancias xestionadas ou con modelos de subscrición de escritorio que non expoñen credenciais directas ao usuario.
                                            </div>
                                        </div>

                                        {/* Risco 4: Plan Previo e Confirmación */}
                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="flex items-center gap-2 text-cyan-400 font-bold text-sm mb-2">
                                                <span>✋</span> 4. Aprobación Antes de Sobreescribir
                                            </div>
                                            <p className="text-xs text-slate-300 leading-relaxed mb-3">
                                                Ningún colaborador dixital debe modificar, sobrescribir ou borrar un ficheiro orixinal sen presentar antes un plan de acción e pedir confirmación humana expresa.
                                            </p>
                                            <div className="p-3 rounded bg-slate-900 border border-slate-800 text-[11px] text-slate-400">
                                                <strong className="text-white">Regra de ouro:</strong> Conserva sempre unha copia intacta dos datos fonte nun arquivo independente e fai que o axente xere os seus resultados nun arquivo novo.
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* LAPELA 4: CATÁLOGO DE FERRAMENTAS */}
                        {activeTab === 'ferramentas' && (
                            <div className="space-y-6 animate-fadeIn">
                                {/* Sub-selector de categoría */}
                                <div className="flex items-center justify-between bg-slate-900 p-2 rounded-xl border border-slate-800">
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => { setSelectedToolCategory('escritorio'); setSelectedTool(null); }}
                                            className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${
                                                selectedToolCategory === 'escritorio'
                                                    ? 'bg-orange-500 text-white shadow-md'
                                                    : 'text-slate-400 hover:text-white'
                                            }`}
                                        >
                                            🖥️ IAs de Escritorio (Gran Público / Docentes)
                                        </button>
                                        <button
                                            onClick={() => { setSelectedToolCategory('arneses'); setSelectedTool(null); }}
                                            className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${
                                                selectedToolCategory === 'arneses'
                                                    ? 'bg-purple-600 text-white shadow-md'
                                                    : 'text-slate-400 hover:text-white'
                                            }`}
                                        >
                                            ⚙️ Arneses e Frameworks (Avanzado / Minoritario)
                                        </button>
                                    </div>
                                    <span className="text-[11px] text-slate-500 hidden md:inline">
                                        {selectedToolCategory === 'escritorio' ? '5 plataformas recomendadas' : '3 contornas para perfís técnicos'}
                                    </span>
                                </div>

                                {/* Listado de Ferramentas: ESCRITORIO */}
                                {selectedToolCategory === 'escritorio' && (
                                    <div className="grid md:grid-cols-3 gap-4">
                                        {ferramentasEscritorio.map(tool => (
                                            <div
                                                key={tool.id}
                                                onClick={() => setSelectedTool(tool)}
                                                className={`bg-slate-900 border rounded-xl p-5 cursor-pointer transition-all hover:-translate-y-1 ${
                                                    selectedTool?.id === tool.id
                                                        ? 'border-orange-500 shadow-lg shadow-orange-500/10 bg-slate-850'
                                                        : 'border-slate-800 hover:border-slate-700'
                                                }`}
                                            >
                                                <div className="flex items-center justify-between mb-2">
                                                    <span className="text-xs font-mono text-slate-500">{tool.empresa}</span>
                                                    <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-slate-800 text-amber-400 border border-slate-700">
                                                        {tool.badge}
                                                    </span>
                                                </div>
                                                <h4 className="text-lg font-bold text-white mb-2">{tool.nome}</h4>
                                                <p className="text-xs text-slate-400 line-clamp-3 leading-relaxed mb-4">
                                                    {tool.descricion}
                                                </p>
                                                <div className="text-[11px] text-orange-400 font-semibold flex items-center gap-1">
                                                    <span>Ver capacidades e seguridade</span> &rarr;
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* Listado de Ferramentas: ARNESES */}
                                {selectedToolCategory === 'arneses' && (
                                    <div className="grid md:grid-cols-3 gap-4">
                                        {ferramentasArneses.map(tool => (
                                            <div
                                                key={tool.id}
                                                onClick={() => setSelectedTool(tool)}
                                                className={`bg-slate-900 border rounded-xl p-5 cursor-pointer transition-all hover:-translate-y-1 ${
                                                    selectedTool?.id === tool.id
                                                        ? 'border-purple-500 shadow-lg shadow-purple-500/10'
                                                        : 'border-slate-800 hover:border-slate-700'
                                                }`}
                                            >
                                                <div className="flex items-center justify-between mb-2">
                                                    <span className="text-xs font-mono text-slate-500">{tool.tipo}</span>
                                                    <span className="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-slate-800 text-purple-400 border border-slate-700">
                                                        {tool.badge}
                                                    </span>
                                                </div>
                                                <h4 className="text-lg font-bold text-white mb-2">{tool.nome}</h4>
                                                <p className="text-xs text-slate-400 line-clamp-3 leading-relaxed mb-4">
                                                    {tool.descricion}
                                                </p>
                                                <div className="text-[11px] text-purple-400 font-semibold flex items-center gap-1">
                                                    <span>Detalle técnico e perfil</span> &rarr;
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {/* Modal / Panel de Detalle da Ferramenta Seleccionada */}
                                {selectedTool && (
                                    <div className="bg-slate-900 border-2 border-slate-700 rounded-2xl p-6 relative animate-fadeIn shadow-2xl">
                                        <button
                                            onClick={() => setSelectedTool(null)}
                                            className="absolute top-4 right-4 text-slate-400 hover:text-white text-lg font-bold w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center"
                                        >
                                            ✕
                                        </button>

                                        <div className="flex flex-wrap items-center gap-3 mb-3">
                                            <h3 className="text-2xl font-bold text-white">{selectedTool.nome}</h3>
                                            <span className="px-2.5 py-0.5 rounded-full text-xs font-bold uppercase bg-slate-800 text-amber-400 border border-slate-700">
                                                {selectedTool.badge}
                                            </span>
                                        </div>

                                        <p className="text-sm text-slate-300 leading-relaxed mb-6 max-w-4xl">
                                            {selectedTool.descricion}
                                        </p>

                                        <div className="grid md:grid-cols-2 gap-6 pt-4 border-t border-slate-800">
                                            {selectedTool.capacidades ? (
                                                <div>
                                                    <h5 className="text-xs uppercase font-bold tracking-wider text-slate-400 mb-3">Capacidades Destacadas:</h5>
                                                    <ul className="space-y-2 text-xs text-slate-300">
                                                        {selectedTool.capacidades.map((cap, i) => (
                                                            <li key={i} className="flex items-start gap-2">
                                                                <span className="text-emerald-400">✓</span>
                                                                <span>{cap}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            ) : (
                                                <div>
                                                    <h5 className="text-xs uppercase font-bold tracking-wider text-slate-400 mb-3">Características Técnicas:</h5>
                                                    <ul className="space-y-2 text-xs text-slate-300">
                                                        {selectedTool.caracteristicas.map((car, i) => (
                                                            <li key={i} className="flex items-start gap-2">
                                                                <span className="text-purple-400">⚙</span>
                                                                <span>{car}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                            )}

                                            <div className="space-y-4">
                                                {selectedTool.seguridade && (
                                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                        <h5 className="text-xs uppercase font-bold tracking-wider text-rose-400 mb-1 flex items-center gap-1">
                                                            <span>🛡️</span> Criterio de Seguridade:
                                                        </h5>
                                                        <p className="text-xs text-slate-300 leading-relaxed">
                                                            {selectedTool.seguridade}
                                                        </p>
                                                    </div>
                                                )}
                                                {selectedTool.idealPara && (
                                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                        <h5 className="text-xs uppercase font-bold tracking-wider text-amber-400 mb-1 flex items-center gap-1">
                                                            <span>🎯</span> Ideal Para a Aula / Práctica:
                                                        </h5>
                                                        <p className="text-xs text-slate-300 leading-relaxed">
                                                            {selectedTool.idealPara}
                                                        </p>
                                                    </div>
                                                )}
                                                {selectedTool.perfil && (
                                                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                        <h5 className="text-xs uppercase font-bold tracking-wider text-cyan-400 mb-1">
                                                            Perfil Destinatario:
                                                        </h5>
                                                        <p className="text-xs text-slate-300 leading-relaxed">
                                                            {selectedTool.perfil}
                                                        </p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Modulo1App />);
    </script>
</body>

</html>
