<!DOCTYPE html>
<html lang="gl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 2: Arquitectura e Método de Traballo (Edición 2026–2027)</title>
    <link rel="stylesheet" href="../../CSS/estilos_ia.css">
    <link rel="stylesheet" href="../../CSS/axentica.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        'card-elevated': '#334155',
                        cream: '#f8fafc',
                        dim: '#94a3b8',
                        orange: '#f97316',
                        gold: '#f59e0b',
                        cyan: '#06b6d4',
                        emerald: '#10b981',
                        purple: '#8b5cf6',
                        rose: '#f43f5e'
                    },
                    fontFamily: {
                        sans: ['Open Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow-y: auto;
        }
    </style>
</head>

<body class="custom-scroll selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const Modulo2App = () => {
            const [activeSection, setActiveSection] = useState('ciclo');
            const [selectedStep, setSelectedStep] = useState(0);

            const etapasCiclo = [
                {
                    numero: "01",
                    nome: "Percepción e Lectura Acotada",
                    icon: "👀",
                    cor: "cyan",
                    resumo: "O colaborador inspecciona única e exclusivamente os documentos autorizados na carpeta de proxecto.",
                    queFai: "Analiza a estrutura do ficheiro (ex: cabeceiras do CSV, extensións, follas de cálculo ou textos de referencia). Non busca fóra nin accede a outras carpetas do teu ordenador.",
                    regraDocente: "Nunca lle pidas 'mira o que teño nos meus documentos'. Proporciona só a carpeta limpa coas fontes de entrada."
                },
                {
                    numero: "02",
                    nome: "Raciocinio e Plan Previo Obrigatorio",
                    icon: "🧠",
                    cor: "gold",
                    resumo: "Antes de tocar ningunha ferramenta ou arquivo, o colaborador debe formular un plan estruturado e parar.",
                    queFai: "Detalla as etapas: que datos filtrará, que cálculos executará, que estrutura terá a saída e que posibles erros detecta previamente.",
                    regraDocente: "Se o axente empeza a crear arquivos ou escribir código sen pedir conformidade sobre o plan, para a execución de inmediato."
                },
                {
                    numero: "03",
                    nome: "Acción con Ferramentas Autorizadas",
                    icon: "⚡",
                    cor: "orange",
                    resumo: "Execución por fases utilizando as ferramentas permitidas (código determinista, transformación de datos, redacción).",
                    queFai: "Xera código limpo, procesa os números de forma matemática (non inventando porcentaxes) e crea os arquivos intermedios e finais na carpeta de entregables.",
                    regraDocente: "Esixe sempre ferramentas de cálculo estrito para datos cuantitativos; os modelos lingüísticos non son calculadoras nativas."
                },
                {
                    numero: "04",
                    nome: "Supervisión Humana e Validación (HITL)",
                    icon: "🛡️",
                    cor: "purple",
                    resumo: "Puntos de parada obrigatorios onde o docente audita a calidade, corrixe desvíos e asume a responsabilidade.",
                    queFai: "O sistema entrega o produto, sinala posibles discrepancias e solicita confirmación antes de calquera sobrescritura.",
                    regraDocente: "O colaborador propón; ti decides e asumes a autoría profesional do material que finalmente se utilizará."
                }
            ];

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 p-6 md:p-10 pl-20 md:pl-24">
                    {/* Cabeceira do Módulo */}
                    <div className="max-w-6xl mx-auto mb-8 border-b border-slate-800 pb-6">
                        <div className="flex flex-wrap items-center justify-between gap-4 mb-3">
                            <div className="flex items-center gap-3">
                                <span className="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">
                                    Módulo 2
                                </span>
                                <span className="text-slate-400 text-sm">Formación Docente 2026–2027</span>
                            </div>
                            <div className="text-xs text-slate-500 font-mono">
                                Método: Acoutamento &gt; Plan &gt; Auditoría
                            </div>
                        </div>
                        <h1 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight">
                            Arquitectura e Método de Traballo do Colaborador
                        </h1>
                        <p className="text-slate-400 text-base md:text-lg mt-2 max-w-4xl">
                            Como estruturar a colaboración para que sexa <strong className="text-cyan-400">segura, reproducible e controlada</strong>: espazo de proxecto illado, plan previo obrigatorio e o patrón «instantánea».
                        </p>

                        {/* Navegación interna */}
                        <div className="flex flex-wrap gap-2 mt-6">
                            {[
                                { id: 'ciclo', label: '1. O Ciclo Axéntico', icon: '🔄' },
                                { id: 'workspace', label: '2. O Espazo de Proxecto (Workspace)', icon: '📁' },
                                { id: 'plan', label: '3. O Plan Previo Obrigatorio', icon: '📋' },
                                { id: 'snapshot', label: '4. O Patrón «Instantánea»', icon: '📸' }
                            ].map(sec => (
                                <button
                                    key={sec.id}
                                    onClick={() => setActiveSection(sec.id)}
                                    className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 ${
                                        activeSection === sec.id
                                            ? 'bg-cyan-500 text-slate-950 font-bold shadow-lg shadow-cyan-500/20'
                                            : 'bg-slate-900 text-slate-400 hover:bg-slate-800 hover:text-slate-200 border border-slate-800'
                                    }`}
                                >
                                    <span>{sec.icon}</span>
                                    <span>{sec.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto">

                        {/* SECCIÓN 1: O CICLO AXÉNTICO */}
                        {activeSection === 'ciclo' && (
                            <div className="space-y-8 animate-fadeIn">
                                {/* Diagrama do Ciclo */}
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    {etapasCiclo.map((etapa, idx) => (
                                        <div
                                            key={idx}
                                            onClick={() => setSelectedStep(idx)}
                                            className={`bg-slate-900 border rounded-2xl p-5 cursor-pointer transition-all ${
                                                selectedStep === idx
                                                    ? 'border-cyan-400 bg-slate-850 shadow-lg shadow-cyan-500/10 -translate-y-1'
                                                    : 'border-slate-800 hover:border-slate-700'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between mb-3">
                                                <span className="font-mono text-xs font-bold text-slate-500">ETAPA {etapa.numero}</span>
                                                <span className="text-2xl">{etapa.icon}</span>
                                            </div>
                                            <h4 className="text-base font-bold text-white mb-2">{etapa.nome}</h4>
                                            <p className="text-xs text-slate-400 line-clamp-3 leading-relaxed">
                                                {etapa.resumo}
                                            </p>
                                        </div>
                                    ))}
                                </div>

                                {/* Detalle da Etapa Seleccionada */}
                                {(() => {
                                    const step = etapasCiclo[selectedStep];
                                    return (
                                        <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-6 md:p-8 relative overflow-hidden">
                                            <div className="flex items-center gap-3 mb-4">
                                                <span className="text-3xl">{step.icon}</span>
                                                <div>
                                                    <span className="text-xs font-mono uppercase text-cyan-400 font-bold tracking-wider">Etapa {step.numero} en detalle</span>
                                                    <h3 className="text-2xl font-bold text-white">{step.nome}</h3>
                                                </div>
                                            </div>

                                            <div className="grid md:grid-cols-2 gap-6 mt-6">
                                                <div className="bg-slate-950 p-5 rounded-xl border border-slate-800 space-y-3">
                                                    <h5 className="text-xs uppercase font-bold tracking-wider text-slate-400">O que fai o colaborador dixital:</h5>
                                                    <p className="text-sm text-slate-300 leading-relaxed">
                                                        {step.queFai}
                                                    </p>
                                                </div>

                                                <div className="bg-cyan-950/30 p-5 rounded-xl border border-cyan-500/30 space-y-3">
                                                    <h5 className="text-xs uppercase font-bold tracking-wider text-cyan-300 flex items-center gap-1.5">
                                                        <span>🛡️</span> Regra Profesional Docente:
                                                    </h5>
                                                    <p className="text-sm text-cyan-100 leading-relaxed">
                                                        {step.regraDocente}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}

                        {/* SECCIÓN 2: O ESPAZO DE PROXECTO (WORKSPACE) */}
                        {activeSection === 'workspace' && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8">
                                    <h3 className="text-xl font-bold text-white mb-2 flex items-center gap-2">
                                        <span className="text-cyan-400">📁</span> Anatomía dun Espazo de Proxecto Limpo
                                    </h3>
                                    <p className="text-slate-400 text-sm mb-6">
                                        O concepto de <strong>Workspace</strong> é a fronteira física e dixital que garante a seguridade. O axente só pode ver o que colocas dentro del e só debe escribir na carpeta de resultados.
                                    </p>

                                    <div className="grid md:grid-cols-2 gap-6 items-center">
                                        {/* Árbore de cartafoles */}
                                        <div className="bg-slate-950 p-6 rounded-xl border border-slate-800 font-mono text-xs text-slate-300 space-y-2">
                                            <div className="text-slate-500">// Estrutura recomendada para a aula</div>
                                            <div className="text-cyan-400 font-bold">📁 Proxecto_Aula_2027/</div>
                                            <div className="pl-4 text-emerald-400">├── 📁 Fontes_Autorizadas/ <span className="text-slate-500 text-[10px]">(Só Lectura)</span></div>
                                            <div className="pl-8 text-slate-400">├── datos_reais_2026.csv</div>
                                            <div className="pl-8 text-slate-400">└── fontes_documentais.md</div>
                                            <div className="pl-4 text-orange-400">├── 📁 Entregables/ <span className="text-slate-500 text-[10px]">(Onde o axente escribe)</span></div>
                                            <div className="pl-8 text-slate-300">├── visualizador.html</div>
                                            <div className="pl-8 text-slate-300">└── informe_analise.md</div>
                                            <div className="pl-4 text-purple-400">└── 📄 FICHA_DESEÑO_COLABORADOR.md <span className="text-slate-500 text-[10px]">(Instrucións mestras)</span></div>
                                        </div>

                                        {/* Principios de illamento */}
                                        <div className="space-y-4">
                                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                <h4 className="text-sm font-bold text-emerald-400 mb-1 flex items-center gap-1.5">
                                                    <span>🔒</span> Lectura Acotada
                                                </h4>
                                                <p className="text-xs text-slate-400 leading-relaxed">
                                                    O colaborador só le os arquivos de <code className="text-emerald-300">Fontes_Autorizadas/</code>. Se precisa datos adicionais, pídelle ao docente que os engada; nunca sae a navegar pola rede libremente.
                                                </p>
                                            </div>

                                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                <h4 className="text-sm font-bold text-orange-400 mb-1 flex items-center gap-1.5">
                                                    <span>✍️</span> Escritura Contida
                                                </h4>
                                                <p className="text-xs text-slate-400 leading-relaxed">
                                                    O axente só xera ficheiros dentro de <code className="text-orange-300">Entregables/</code>. Nunca modifica os orixinais, garantindo que os teus datos orixinais permanezan intactos e auditables.
                                                </p>
                                            </div>

                                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                                <h4 className="text-sm font-bold text-rose-400 mb-1 flex items-center gap-1.5">
                                                    <span>⛔</span> Liñas Vermellas
                                                </h4>
                                                <p className="text-xs text-slate-400 leading-relaxed">
                                                    Sen acceso a correo, sen terminal desatendido, sen contrasinais corporativos e sen conexión directa a plataformas con datos de alumnado (Abalar / Moodle).
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* SECCIÓN 3: O PLAN PREVIO OBRIGATORIO */}
                        {activeSection === 'plan' && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8">
                                    <h3 className="text-xl font-bold text-white mb-2 flex items-center gap-2">
                                        <span className="text-amber-400">📋</span> Por que esixir SEMPRE un Plan antes de Executar
                                    </h3>
                                    <p className="text-slate-400 text-sm mb-6">
                                        Deixar que un axente actúe sen plan equivale a deixar que alguén constrúa unha casa sen plano arquitectónico. O plan previo é a túa ferramenta de control.
                                    </p>

                                    <div className="grid md:grid-cols-2 gap-6">
                                        {/* Comparación visual */}
                                        <div className="bg-slate-950 p-5 rounded-xl border border-red-500/30">
                                            <div className="text-xs font-bold text-red-400 uppercase tracking-wider mb-2">
                                                ❌ Execución sen plan (Risco alto)
                                            </div>
                                            <div className="bg-slate-900 p-3 rounded font-mono text-xs text-slate-400 mb-3">
                                                "Fai un visualizador con este CSV."
                                            </div>
                                            <ul className="text-xs text-slate-400 space-y-2">
                                                <li>• O axente asume que entendiches as columnas sen verificar.</li>
                                                <li>• Escribe centos de liñas de código baseadas en suposicións erróneas.</li>
                                                <li>• Consome tokens e tempo de execución sen rumbo claro.</li>
                                                <li>• Se falla, é moi difícil saber en que paso cometeu o erro.</li>
                                            </ul>
                                        </div>

                                        <div className="bg-slate-950 p-5 rounded-xl border border-emerald-500/30">
                                            <div className="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2">
                                                ✅ O Protocolo do Plan Previo (Boas Prácticas)
                                            </div>
                                            <div className="bg-slate-900 p-3 rounded font-mono text-xs text-amber-300 mb-3">
                                                "Le o CSV. Dime que columnas ves, que problemas detectas e proponme un plan de 4 etapas. Agarda a miña confirmación antes de facer código."
                                            </div>
                                            <ul className="text-xs text-slate-300 space-y-2">
                                                <li>• <strong className="text-white">Auditoría previa:</strong> confirma que o axente le ben as unidades.</li>
                                                <li>• <strong className="text-white">Pausa obrigatoria:</strong> ti revisas e dis: "cambia a etapa 2".</li>
                                                <li>• <strong className="text-white">Aforro de erros:</strong> corríxense as discrepancias antes de que se xeren arquivos.</li>
                                                <li>• <strong className="text-white">Trazabilidade:</strong> queda rexistrado cada paso acordado.</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* SECCIÓN 4: O PATRÓN «INSTANTÁNEA» (SNAPSHOT) */}
                        {activeSection === 'snapshot' && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8">
                                    <div className="flex items-center gap-3 mb-4">
                                        <div className="w-10 h-10 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl font-bold">
                                            📸
                                        </div>
                                        <div>
                                            <h3 className="text-xl font-bold text-white">O Patrón «Instantánea» (Snapshot)</h3>
                                            <p className="text-slate-400 text-xs">A estratexia definitiva para que as actividades non fallen na aula.</p>
                                        </div>
                                    </div>

                                    <div className="grid md:grid-cols-3 gap-5 mt-6">
                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="text-emerald-400 font-bold text-sm mb-2">1. Descarga Local</div>
                                            <p className="text-xs text-slate-400 leading-relaxed">
                                                Nunca fagas que a aplicación dependa dunha API externa viva ou dunha consulta web en directo durante a clase. Descarga os datos previamente á carpeta de proxecto.
                                            </p>
                                        </div>

                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="text-cyan-400 font-bold text-sm mb-2">2. Ficha de Metadatos</div>
                                            <p className="text-xs text-slate-400 leading-relaxed">
                                                Cada arquivo descargado debe levar un rexistro claro: <strong>data de captura, URL oficial de orixe e tipo de licenza</strong> (Open Data, CC-BY, dominio público).
                                            </p>
                                        </div>

                                        <div className="bg-slate-950 p-5 rounded-xl border border-slate-800">
                                            <div className="text-amber-400 font-bold text-sm mb-2">3. Execución Offline</div>
                                            <p className="text-xs text-slate-400 leading-relaxed">
                                                A micro-app ou visualizador resultante debe funcionar abrindo o ficheiro <code className="text-amber-300">.html</code> no navegador, mesmo se a rede do centro cae por completo.
                                            </p>
                                        </div>
                                    </div>

                                    <div className="mt-6 p-4 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between">
                                        <div className="text-xs text-slate-300">
                                            <strong>Beneficio directo:</strong> Cero sorpresas por caídas de servizo, cero custos por chamadas a APIs e reproducibilidade científica e pedagóxica absoluta.
                                        </div>
                                        <span className="px-3 py-1 rounded-full text-xs font-bold uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                                            100% Robusto
                                        </span>
                                    </div>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Modulo2App />);
    </script>
</body>

</html>
