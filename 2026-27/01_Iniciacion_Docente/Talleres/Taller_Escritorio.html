            Terminal: (p) => <Icon {...p}><polyline points="4 17 10 11 4 5" /><line x1="12" y1="19" x2="20" y2="19" /></Icon>,
            Copy: (p) => <Icon {...p}><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></Icon>,

            Cpu: (p) => <Icon {...p}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><line x1="9" y1="1" x2="9" y2="4" /><line x1="15" y1="1" x2="15" y2="4" /><line x1="9" y1="20" x2="9" y2="23" /><line x1="15" y1="20" x2="15" y2="23" /><line x1="20" y1="9" x2="23" y2="9" /><line x1="20" y1="15" x2="23" y2="15" /><line x1="1" y1="9" x2="4" y2="9" /><line x1="1" y1="15" x2="4" y2="15" /></Icon>,

        const MissionCard = ({ title, difficulty, icon: IconComponent, colorClass, tasks }) => {
            const [currentTask, setCurrentTask] = useState(0);
            const [copied, setCopied] = useState(false);
            const task = tasks[currentTask];

            const copyPrompt = () => {
                navigator.clipboard.writeText(task.prompt);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const nextTask = (e) => { e.stopPropagation(); setCurrentTask((prev) => (prev + 1) % tasks.length); setCopied(false); };
            const prevTask = (e) => { e.stopPropagation(); setCurrentTask((prev) => (prev - 1 + tasks.length) % tasks.length); setCopied(false); };

            return (
                <div className={`bg-card border-2 ${colorClass} rounded-xl p-5 flex flex-col justify-between h-full shadow-lg relative overflow-hidden`}>
                    <div>
                        <div className="flex justify-between items-start mb-3 border-b border-white/10 pb-3">

                                <div>
                                    <h3 className="font-bold text-base text-cream">{title}</h3>
                                    <span className="text-[10px] text-dim block">{difficulty}</span>
                                </div>
                            </div>
                            <span className="text-xs font-mono px-2 py-0.5 bg-white/5 rounded text-gold">{currentTask + 1}/{tasks.length}</span>
                        </div>
                        <div className="mb-2">
                            <h4 className="text-sm font-semibold text-cream mb-1">{task.name}</h4>
                            <p className="text-xs text-dim italic mb-3">{task.context}</p>
                        </div>
                    </div>
                    <div className="bg-black/40 border border-white/5 rounded-lg p-3 relative group flex-grow flex flex-col mb-3">
                        <button onClick={copyPrompt} className="absolute top-2 right-2 bg-white/10 hover:bg-gold hover:text-dark text-white p-1.5 rounded transition-all z-10" title="Copiar Prompt">
                            {copied ? <Icons.Check size={14} className="text-green" /> : <Icons.Copy size={14} />}
                        </button>
                        <p className="text-[11px] text-purple-100/90 font-mono leading-relaxed whitespace-pre-line custom-scroll overflow-y-auto h-full pr-2">{task.prompt}</p>
                    </div>
                    <div className="flex justify-between items-center mt-auto pt-2 border-t border-white/5">
                        <button onClick={prevTask} className="text-dim hover:text-white p-2 hover:bg-white/5 rounded"><Icons.ChevronLeft /></button>
                        <span className="text-[9px] uppercase text-dim tracking-widest opacity-50">Navegar Misións</span>
                        <button onClick={nextTask} className="text-dim hover:text-white p-2 hover:bg-white/5 rounded"><Icons.ChevronRight /></button>
                    </div>
                </div>
            );
        };

                    badge: "MCP / Cowork",
                    type: "Cliente de Escritorio",
                    isLocal: false,
                    cost: "Freemium / Pro",
                    privacyTag: "Nube (Cifrado)",

                    tagline: "Modos Chat, Cowork e Code con soporte nativo do protocolo MCP.",

                {

                    badge: "Codex / Work",

                    isLocal: false,
                    cost: "Freemium / Pro",
                    privacyTag: "Nube (OpenAI)",
                    color: "border-green-500/50 text-green-400 shadow-[0_0_15px_rgba(34,197,94,0.15)]",

                    color: "border-blue-500/50 text-blue-300 shadow-[0_0_15px_rgba(59,130,246,0.15)]",

            const missionData = {

                    {
                        name: "Clasificación de Arquivos de Aula",
                        context: "Axente de escritorio que organiza carpetas docentes con confirmación previa.",
                        prompt: `(Para executar en Claude Desktop / ChatGPT Desktop nunha carpeta de proba «Aula_Proba», sen datos persoais):

                    }

"[PEGAR TEXTO DO ALUMNO]"

2. Destaca dous puntos fortes da redacción (cohesión, vocabulario rico).
3. Propón tres suxestións amables de mellora para axudar ao alumno a reformular o segundo parágrafo.`
                    },
                    {
                        name: "Resumo Seguro de Acta de Claustro",
                        context: "Sintetizar notas internas confidenciais sen filtracións externas.",
                        prompt: `(Para executar nun modelo local sen conexión a internet):

Actúa como secretario de centro educativo.
A partir das seguintes notas en bruto da reunión de coordinación:
[PEGAR NOTAS DA REUNIÓN]

Xera unha Acta Sintética que conteña:
- Puntos principais acordados.
- Compromisos e tarefas pendentes con prazos.
- Asuntos derivados ao seguinte claustro.
Ton: Neutro, conciso e institucional.`
                    }
                ],
                axentes: [
                    {
                        name: "Xerar Mini-Aplicación Web Didáctica",
                        context: "Crear un xogo ou calculadora interactiva para clase usando Cursor ou Antigravity.",
                        prompt: `(Para usar en Cursor / Antigravity / Devin Desktop):

Crea unha páxina web nun único ficheiro HTML interactivo para alumnos de 3º ESO chamada "Calculadora da Pegada de Carbono Escolar".
Debe incluír:
1. Catro preguntas sinxelas con botóns (transporte ao colexio, almorzo, reciclaxe, uso de papel).

3. Un deseño moderno, accesible e limpo con Tailwind CSS.
4. Un botón final que mostre 3 consellos personalizados en lingua galega para o centro.`
                    },
                    {
                        name: "Automatización de Rúbricas a Folla de Cálculo",
                        context: "Xerar un arquivo estruturado CSV/Excel dende criterios descritivos.",
                        prompt: `(Para axentes con ferramentas de ficheiro):

A partir desta táboa de criterios de avaliación LOMLOE para Educación Física:
[PEGAR CRITERIOS]

Constrúe unha folla estruturada en formato CSV lista para importar na nosa folla de cálculo docente con:
- Columna A: Código do criterio.
- Columna B: Descrición do saber básico.
- Columnas C a F: Niveis de logro 1 (Insuficiente), 2 (Suficiente), 3 (Notable), 4 (Sobresaliente).`

            useEffect(() => {

            return (

                                        </p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">

                                    Desliza para Misións Agénticas e Locais ➜
