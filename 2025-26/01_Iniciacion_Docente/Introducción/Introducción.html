<!DOCTYPE html>
<html lang="gl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introdución á IA</title>
    <link rel="stylesheet" href="../CSS/estilos_ia.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { dark: 'var(--bg-dark)', card: 'var(--card-bg)', cream: 'var(--text-main)', dim: 'var(--text-dim)', gold: 'var(--accent-gold)', orange: 'var(--accent-orange)', retro: 'var(--accent-retro)', cyan: '#06B6D4', purple: '#8B5CF6' }, fontFamily: { sans: ['Open Sans', 'sans-serif'] }, animation: { 'fade-in-up': 'fadeInUp 0.8s ease-out forwards', 'bounce-slow': 'bounce 3s infinite' }, keyframes: { fadeInUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,800;1,400&display=swap"
        rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        .bg-glow {
            background: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, rgba(18, 18, 18, 0) 60%);
        }

        .locked-section {
            opacity: 0.1;
            filter: blur(5px);
            pointer-events: none;
            transition: all 0.8s ease;
            transform: translateY(20px);
        }

        .unlocked-section {
            opacity: 1;
            filter: blur(0);
            pointer-events: auto;
            transform: translateY(0);
        }
    </style>
</head>

<body class="bg-dark text-cream font-sans overflow-x-hidden bg-glow">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const Icon = ({ path, className, size = 24 }) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>);
        const Icons = { ArrowDown: (props) => <Icon {...props} path={<path d="M12 5v14M19 12l-7 7-7-7" />} />, Brain: (props) => <Icon {...props} path={<path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z" />} />, Zap: (props) => <Icon {...props} path={<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />} />, AlertTriangle: (props) => <Icon {...props} path={<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></>} /> };

        const ParadigmShift = () => {
            const [activeTab, setActiveTab] = useState('tradicional');
            return (
                <div className="bg-card border border-white/10 rounded-lg p-8 shadow-2xl mt-8">
                    <h3 className="text-xl font-bold mb-6 text-center text-cream uppercase tracking-widest">O Cambio de Paradigma</h3>
                    <div className="flex justify-center mb-8 gap-4">
                        <button onClick={() => setActiveTab('tradicional')} className={`px-6 py-2 rounded-full text-xs md:text-sm font-bold transition-all duration-300 border ${activeTab === 'tradicional' ? 'bg-white/10 border-gold text-gold shadow-[0_0_15px_rgba(212,175,55,0.2)]' : 'border-transparent text-dim hover:text-white'}`}>Programación Tradicional</button>
                        <button onClick={() => setActiveTab('ia')} className={`px-6 py-2 rounded-full text-xs md:text-sm font-bold transition-all duration-300 border ${activeTab === 'ia' ? 'bg-white/10 border-cyan text-cyan shadow-[0_0_15px_rgba(6,182,212,0.2)]' : 'border-transparent text-dim hover:text-white'}`}>Uso da IA</button>
                    </div>
                    <div className="mb-10 flex justify-center animate-fade-in-up">
                        <img src={activeTab === 'tradicional' ? './img/Paradigma_Programa.png' : './img/Paradigma_IA.png'} alt={`Diagrama ${activeTab}`} className="rounded-lg border border-white/10 shadow-lg max-h-[250px] object-contain" />
                    </div>
                    <div className="text-center min-h-[300px]">
                        {activeTab === 'tradicional' ? (
                            <React.Fragment>
                                <div className="mb-4 animate-fade-in-up"><span className="text-xs font-bold text-gold uppercase tracking-widest mb-2 block">Entrada (Programador)</span><div className="text-gold text-3xl animate-bounce-slow">↓</div></div>
                                <div className="border-2 border-white/10 rounded-lg p-6 bg-black/20 backdrop-blur-sm relative animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                                    <span className="absolute -top-3 left-1/2 -translate-x-1/2 bg-card px-3 text-xs text-dim font-bold uppercase tracking-widest">A Máquina (Procesamento)</span>
                                    <div className="grid md:grid-cols-3 gap-4 items-center">
                                        <div className="p-4 border border-white/5 rounded bg-black/30"><span className="text-3xl mb-2 block">📋</span><h4 className="font-bold text-gold text-sm">Regras (Código)</h4><p className="text-xs text-dim mt-1">IF / ELSE explícito</p></div>
                                        <div className="text-2xl text-dim font-bold">➕</div>
                                        <div className="p-4 border border-white/5 rounded bg-black/30"><span className="text-3xl mb-2 block">📊</span><h4 className="font-bold text-gold text-sm">Datos</h4><p className="text-xs text-dim mt-1">Información bruta</p></div>
                                    </div>
                                </div>
                                <div className="my-4 text-dim text-2xl">⬇️</div>
                                <div className="animate-fade-in-up p-6 border-l-4 border-gold bg-gold/5" style={{ animationDelay: '0.2s' }}><h4 className="font-bold text-white text-xl">Resposta Exacta</h4><p className="text-gold mt-1 text-sm">Resultado predicible e único</p></div>
                            </React.Fragment>
                        ) : (
                            <React.Fragment>
                                <div className="mb-4 animate-fade-in-up">
                                    <span className="text-xs font-bold text-cyan uppercase tracking-widest mb-2 block">Entrada (A túa Petición)</span>
                                    <div className="p-3 border border-cyan/30 rounded-full inline-block bg-cyan/5 mb-2"><span className="text-sm text-cream italic">"Crea unha rubrica para avaliar esta actividade..."</span></div>
                                    <div className="text-cyan text-3xl animate-bounce-slow">↓</div>
                                </div>
                                <div className="border-2 border-cyan/20 rounded-lg p-6 bg-black/40 backdrop-blur-sm relative animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                                    <span className="absolute -top-3 left-1/2 -translate-x-1/2 bg-card px-3 text-xs text-cyan font-bold uppercase tracking-widest">A "Caixa Negra" (Modelo IA)</span>
                                    <div className="grid md:grid-cols-3 gap-4 items-center relative overflow-hidden">
                                        <div className="absolute inset-0 bg-gradient-to-r from-transparent via-cyan/5 to-transparent animate-pulse pointer-events-none"></div>
                                        <div className="p-4 border border-cyan/10 rounded bg-cyan/5"><span className="text-3xl mb-2 block">📚</span><h4 className="font-bold text-cyan text-sm">Datos Masivos</h4><p className="text-xs text-dim mt-1">Internet enteira</p></div>
                                        <div className="text-2xl text-cyan font-bold opacity-50">➕</div>
                                        <div className="p-4 border border-cyan/10 rounded bg-cyan/5"><span className="text-3xl mb-2 block">🧠</span><h4 className="font-bold text-cyan text-sm">Algoritmo</h4><p className="text-xs text-dim mt-1">Rede Neuronal</p></div>
                                    </div>
                                </div>
                                <div className="my-4 text-cyan text-2xl">⬇️</div>
                                <div className="animate-fade-in-up p-6 border-l-4 border-cyan bg-cyan/5" style={{ animationDelay: '0.2s' }}><h4 className="font-bold text-white text-xl">Solicitude Realizada</h4><p className="text-cyan mt-1 text-sm">A IA realiza a tarefa pedida (Texto, Imaxe, etc.)</p></div>
                            </React.Fragment>
                        )}
                    </div>
                </div>
            );
        };

        const MythBuster = ({ myth, reality }) => {
            const [isRevealed, setIsRevealed] = useState(false);
            return (
                <div onClick={() => setIsRevealed(!isRevealed)} className="cursor-pointer group relative bg-card border border-white/5 p-8 rounded-lg hover:border-orange/50 transition-all duration-300 min-h-[180px] flex items-center justify-center text-center shadow-lg">
                    {!isRevealed ? (
                        <div><span className="text-orange font-bold uppercase tracking-widest text-xs mb-3 block">Mito Común</span><h4 className="text-xl md:text-2xl font-bold text-white group-hover:text-orange transition-colors">"{myth}"</h4><div className="mt-4 flex justify-center text-dim opacity-50"><Icons.Brain size={20} /></div></div>
                    ) : (
                        <div className="animate-fade-in-up"><span className="text-green-500 font-bold uppercase tracking-widest text-xs mb-3 block">Realidade</span><p className="text-md md:text-lg text-cream leading-relaxed font-light">{reality}</p></div>
                    )}
                </div>
            );
        };

        const IntroductionApp = () => {
            const [stage, setStage] = useState(0);
            const sectionParadigmRef = useRef(null);
            const sectionMythsRef = useRef(null);
            const unlockStage = (newStage) => {
                setStage(newStage);
                setTimeout(() => {
                    if (newStage === 1 && sectionParadigmRef.current) { sectionParadigmRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
                    if (newStage === 2 && sectionMythsRef.current) { sectionMythsRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
                }, 100);
            };

            return (
                <div className="min-h-screen pb-32">
                    <header className="py-20 px-6 text-center animate-fade-in-up">
                        <div className="max-w-4xl mx-auto"><h4 className="text-retro tracking-[0.3em] uppercase font-bold text-xs md:text-sm mb-6 border-b border-retro/30 inline-block pb-2">Módulo 1</h4><h1 className="text-5xl md:text-7xl font-bold mb-8 text-cream tracking-tight leading-tight">A Caixa <span className="text-transparent bg-clip-text bg-gradient-to-r from-gold to-orange">Negra</span></h1><p className="text-lg md:text-xl text-dim font-light leading-relaxed max-w-2xl mx-auto">Antes de usar as ferramentas, debemos comprender a natureza da besta.</p></div>
                    </header>
                    <main className="max-w-4xl mx-auto px-6 space-y-24">
                        <section className="animate-fade-in-up" style={{ animationDelay: '0.2s' }}>
                            <div className="text-center max-w-3xl mx-auto">
                                <h2 className="text-3xl font-bold mb-6 text-gold">Que é realmente a IA?</h2>
                                <p className="text-dim text-xl leading-relaxed mb-10">Rama da informática dedicada a crear sistemas capaces de realizar tarefas que requiren intelixencia humana: <span className="text-cream border-b border-cyan/30">patróns, decisión e creación.</span></p>
                                <div className="relative p-8 bg-white/5 rounded-lg border-l-4 border-gold/50 italic text-dim text-lg font-serif mb-12 shadow-lg"><span className="absolute top-4 left-4 text-6xl text-gold/10 font-sans leading-none">“</span><p className="relative z-10">"O estudo basearase na conxectura de que cada aspecto da aprendizaxe pode ser descrito con tanta precisión que unha máquina pode ser fabricada para simulala."</p><cite className="block text-right text-xs uppercase tracking-widest not-italic text-gold opacity-80 mt-4 font-sans">— Conferencia de Dartmouth (1956)</cite></div>
                                {stage === 0 && (<button onClick={() => unlockStage(1)} className="group flex flex-col items-center mx-auto text-cream hover:text-cyan transition-colors animate-bounce-slow"><span className="text-xs uppercase tracking-widest mb-2">Entender a Lóxica</span><div className="bg-card border border-white/20 p-3 rounded-full group-hover:border-cyan group-hover:bg-cyan/10 transition-all"><Icons.ArrowDown size={24} /></div></button>)}
                            </div>
                        </section>
                        <section ref={sectionParadigmRef} className={`transition-all duration-1000 ${stage >= 1 ? 'unlocked-section' : 'locked-section'}`}>
                            <div className="w-full"><ParadigmShift /></div>
                            {stage === 1 && (<div className="text-center mt-12"><button onClick={() => unlockStage(2)} className="px-8 py-3 bg-card border border-orange/50 text-orange rounded-full font-bold hover:bg-orange hover:text-white transition-all shadow-lg flex items-center gap-2 mx-auto"><Icons.Zap size={18} />Desmontar Mitos</button></div>)}
                        </section>
                        <section ref={sectionMythsRef} className={`transition-all duration-1000 ${stage >= 2 ? 'unlocked-section' : 'locked-section'}`}>
                            <h2 className="text-3xl font-bold mb-10 text-center text-orange flex items-center justify-center gap-3"><Icons.AlertTriangle size={32} /> Desmontando Mitos</h2>
                            <div className="grid md:grid-cols-2 gap-6">
                                <MythBuster myth="A IA pensa como un humano" reality="A IA non 'pensa' nin 'entende'. Predí a seguinte palabra ou píxel baseándose en probabilidades matemáticas (estatística), coma un loro moi sofisticado." />
                                <MythBuster myth="A IA é obxectiva e neutral" reality="Falso. A IA herda e amplifica os sesgos (racismo, machismo, erros culturais) presentes nos datos de internet cos que foi adestrada." />
                            </div>
                            <div className="relative py-16 text-center mt-16 border-t border-white/10"><blockquote className="text-2xl md:text-3xl font-light text-cream leading-normal italic max-w-3xl mx-auto">"Non é a intelixencia artificial o que me preocupa, é a estupidez humana"</blockquote><p className="mt-4 text-gold font-bold tracking-widest text-sm uppercase">— Neil Jacobstein</p></div>
                        </section>
                    </main>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<IntroductionApp />);
    </script>
</body>

</html>
